name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_APP_ENV: test
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
  JOBS_RUN_SECRET: ci-jobs-secret-0123456789abcdef
  AI_PROVIDER: mock

jobs:
  # ── lint → typecheck (no database) ──────────────────────────────────────────
  static:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: prompt/schema version bump check
        if: github.event_name == 'pull_request'
        run: pnpm check:prompt-versions
        env:
          BASE_REF: origin/${{ github.base_ref }}

  # ── unit + integration → rls → build → e2e (all against local Supabase) ─────
  test:
    name: test + rls + build + e2e
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: start local Supabase
        run: pnpm supabase:start
      - name: export Supabase keys
        # `-o env` double-quotes values and $GITHUB_ENV keeps them literally, so strip the quotes.
        run: |
          eval "$(supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY)=')"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          test -n "$ANON_KEY" && test -n "$SERVICE_ROLE_KEY"
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test
      - run: pnpm test:rls
      - run: pnpm build
      - name: client bundle secret scan
        run: pnpm check:client-bundle
      - name: install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      # Demo accounts are e2e infrastructure (docs/TESTING.md): journal.spec signs in as demo-cleo.
      - run: pnpm demo:seed
      - run: pnpm test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: stop Supabase
        if: always()
        run: pnpm supabase:stop
